<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-white); }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-ink-10); padding: 10px 0; }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--color-neutral); width: 96px; flex: none; }
  .spec { font-family: var(--font-heading); font-weight: 500; color: var(--color-neutral-darkest); letter-spacing: -0.01em; line-height: 1.1; }
</style>
</head>
<body>
  <div class="row"><span class="meta">H1 · 72 / 44</span><span class="spec" style="font-size:52px;">Ferro Tungsten</span></div>
  <div class="row"><span class="meta">H2 · 52 / 40</span><span class="spec" style="font-size:40px;">Made with precision</span></div>
  <div class="row"><span class="meta">H3 · 44 / 32</span><span class="spec" style="font-size:32px;">Our Competitiveness</span></div>
</body>
</html>
