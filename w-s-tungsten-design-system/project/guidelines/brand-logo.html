<!-- @dsCard group="Brand" viewport="700x170" name="Logo — WSTK" subtitle="White mark on dark schemes; ore glyph + wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--color-white); font-family: var(--font-body); display: grid; grid-template-columns: 1fr 1fr; }
  .panel { height: 170px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .dark { background: var(--color-neutral-darkest); }
  .teal { background: var(--color-deep-sea-green-darker); }
  .panel img { height: 40px; width: auto; }
  .tag { position: absolute; margin: 12px; font-size: 11px; color: var(--color-white-60); }
  .panel { position: relative; }
</style>
</head>
<body>
  <div class="panel dark"><span class="tag">on ink · scheme-4</span><img src="../assets/logo/logo-light.png" alt="WSTK logo"></div>
  <div class="panel teal"><span class="tag">on teal · scheme-1</span><img src="../assets/logo/logo-light.png" alt="WSTK logo"></div>
</body>
</html>
