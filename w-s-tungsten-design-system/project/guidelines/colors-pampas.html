<!-- @dsCard group="Colors" viewport="700x150" name="Pampas — Warm surface" subtitle="Warm off-white section background" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-white); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; max-width: 660px; }
  .sw { height: 84px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; font-family: var(--font-body); }
  .sw span { font-size: 11px; line-height: 1.3; }
  .hex { font-weight: 600; }
  .name { opacity: 0.75; }
  .star { position: absolute; top: 6px; left: 8px; font-size: 11px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--color-pampas-lightest); color:#494948;"><span class="hex">#FEFEFD</span><span class="name">lightest</span></div>
    <div class="sw" style="background:var(--color-pampas-lighter); color:#494948;"><span class="hex">#FDFDFC</span><span class="name">lighter</span></div>
    <div class="sw" style="background:var(--color-pampas-light); color:#494948;"><span class="hex">#F8F8F4</span><span class="name">light</span></div>
    <div class="sw" style="background:var(--color-pampas); color:#494948;"><span class="star">●</span><span class="hex">#F6F5F0</span><span class="name">base</span></div>
    <div class="sw" style="background:var(--color-pampas-dark); color:#494948;"><span class="hex">#C4C4C0</span><span class="name">dark</span></div>
    <div class="sw" style="background:var(--color-pampas-darker); color:#fff;"><span class="hex">#626260</span><span class="name">darker</span></div>
    <div class="sw" style="background:var(--color-pampas-darkest); color:#fff;"><span class="hex">#494948</span><span class="name">darkest</span></div>
  </div>
</body>
</html>
