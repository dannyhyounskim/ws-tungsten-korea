<!-- @dsCard group="Colors" viewport="700x150" name="Neutral" subtitle="Cool grey ink ramp, shade-0 to darkest" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-white); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; max-width: 660px; }
  .sw { height: 84px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; font-family: var(--font-body); }
  .sw span { font-size: 11px; line-height: 1.3; }
  .hex { font-weight: 600; }
  .name { opacity: 0.75; }
  .star { position: absolute; top: 6px; left: 8px; font-size: 11px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--color-neutral-lightest); color:#050a08;"><span class="hex">#F2F2F2</span><span class="name">lightest</span></div>
    <div class="sw" style="background:var(--color-neutral-lighter); color:#050a08;"><span class="hex">#D9DAD9</span><span class="name">lighter</span></div>
    <div class="sw" style="background:var(--color-neutral-light); color:#050a08;"><span class="hex">#B4B5B4</span><span class="name">light</span></div>
    <div class="sw" style="background:var(--color-neutral); color:#fff;"><span class="hex">#828483</span><span class="name">base</span></div>
    <div class="sw" style="background:var(--color-neutral-dark); color:#fff;"><span class="hex">#505352</span><span class="name">dark</span></div>
    <div class="sw" style="background:var(--color-neutral-darker); color:#fff;"><span class="hex">#1E2220</span><span class="name">darker</span></div>
    <div class="sw" style="background:var(--color-neutral-darkest); color:#fff;"><span class="star">●</span><span class="hex">#050A08</span><span class="name">darkest</span></div>
  </div>
</body>
</html>
