<!-- @dsCard group="Colors" viewport="700x150" name="Deep Sea Green — Primary" subtitle="Brand teal ramp; #0B4F6C is primary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-white); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; max-width: 660px; }
  .sw { height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; font-family: var(--font-body); }
  .sw span { font-size: 11px; line-height: 1.3; }
  .hex { font-weight: 600; }
  .name { opacity: 0.75; }
  .star { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: 700; }
  .sw { position: relative; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--color-deep-sea-green-lightest); color:#050a08;"><span class="hex">#E6EDF0</span><span class="name">lightest</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green-lighter); color:#050a08;"><span class="hex">#CEDBE1</span><span class="name">lighter</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green-light); color:#fff;"><span class="hex">#548398</span><span class="name">light</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green); color:#fff;"><span class="star">●</span><span class="hex">#0B4F6C</span><span class="name">base</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green-dark); color:#fff;"><span class="hex">#083F56</span><span class="name">dark</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green-darker); color:#fff;"><span class="hex">#041F2B</span><span class="name">darker</span></div>
    <div class="sw" style="background:var(--color-deep-sea-green-darkest); color:#fff;"><span class="hex">#031720</span><span class="name">darkest</span></div>
  </div>
</body>
</html>
