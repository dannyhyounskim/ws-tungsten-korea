<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base; section rhythm 64/96/112" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-white); font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .bar { height: 16px; background: var(--color-deep-sea-green); }
  .lbl { font-size: 11px; color: var(--color-neutral-dark); width: 96px; flex: none; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">2 · 8px</span><div class="bar" style="width:8px;"></div></div>
  <div class="row"><span class="lbl">4 · 16px</span><div class="bar" style="width:16px;"></div></div>
  <div class="row"><span class="lbl">6 · 24px</span><div class="bar" style="width:24px;"></div></div>
  <div class="row"><span class="lbl">8 · 32px</span><div class="bar" style="width:32px;"></div></div>
  <div class="row"><span class="lbl">12 · 48px</span><div class="bar" style="width:48px;"></div></div>
  <div class="row"><span class="lbl">16 · 64px</span><div class="bar" style="width:64px;"></div></div>
  <div class="row"><span class="lbl">24 · 96px</span><div class="bar" style="width:96px;"></div></div>
</body>
</html>
