<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-white); display:grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
  .col h6 { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--color-ink-10); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--color-neutral); width: 84px; flex: none; }
  .h { font-family: var(--font-heading); font-weight: 500; color: var(--color-neutral-darkest); line-height: 1.2; }
  .b { font-family: var(--font-body); color: var(--color-neutral-darkest); line-height: 1.3; }
</style>
</head>
<body>
  <div class="col">
    <h6>Headings · Fraunces 500</h6>
    <div class="row"><span class="meta">H4 · 36</span><span class="h" style="font-size:28px;">Our Product</span></div>
    <div class="row"><span class="meta">H5 · 28</span><span class="h" style="font-size:22px;">Concentrate Warehoused</span></div>
    <div class="row"><span class="meta">H6 · 22</span><span class="h" style="font-size:18px;">Element Symbol</span></div>
  </div>
  <div class="col">
    <h6>Body · Inter 400</h6>
    <div class="row"><span class="meta">Large · 22</span><span class="b" style="font-size:17px;">Leading the world market</span></div>

    <div class="row"><span class="meta">Small · 14</span><span class="b" style="font-size:13px;">Precise analysis by ICP-OES</span></div>
  </div>
</body>
</html>
