<!-- @dsCard group="Type" viewport="700x180" name="Families & eyebrow" subtitle="Fraunces serif + Inter sans, overline label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-white); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { border: 1px solid var(--color-ink-10); padding: 18px; }
  .tag { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral); margin-bottom: 10px; }
  .serif { font-family: var(--font-heading); font-weight: 500; font-size: 42px; line-height: 1; color: var(--color-neutral-darkest); }
  .sans { font-family: var(--font-body); font-weight: 400; font-size: 42px; line-height: 1; color: var(--color-neutral-darkest); }
  .sub { font-family: var(--font-body); font-size: 12px; color: var(--color-neutral); margin-top: 8px; }
  .eyebrow { color: var(--color-deep-sea-green); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Headings</div>
    <div class="serif">Fraunces</div>
    <div class="sub">Aa Bb Cc · 0–9 · weight 500</div>
  </div>
  <div class="card">
    <div class="tag">Body / UI</div>
    <div class="sans">Inter</div>
    <div class="sub"><span class="eyebrow">Our Technology</span> &nbsp;— eyebrow / overline</div>
  </div>
</body>
</html>
