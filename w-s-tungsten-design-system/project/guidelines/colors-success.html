<!-- @dsCard group="Colors" viewport="700x150" name="De York — Success" subtitle="Mint for positive states; #6CC5A1 base" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-white); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; max-width: 660px; }
  .sw { height: 84px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; font-family: var(--font-body); }
  .sw span { font-size: 11px; line-height: 1.3; }
  .hex { font-weight: 600; }
  .name { opacity: 0.75; }
  .star { position: absolute; top: 6px; left: 8px; font-size: 11px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--color-de-york-lightest); color:#203b30;"><span class="hex">#F0F9F5</span><span class="name">lightest</span></div>
    <div class="sw" style="background:var(--color-de-york-lighter); color:#203b30;"><span class="hex">#E1F3EC</span><span class="name">lighter</span></div>
    <div class="sw" style="background:var(--color-de-york-light); color:#203b30;"><span class="hex">#98D6BD</span><span class="name">light</span></div>
    <div class="sw" style="background:var(--color-de-york); color:#203b30;"><span class="star">●</span><span class="hex">#6CC5A1</span><span class="name">base</span></div>
    <div class="sw" style="background:var(--color-de-york-dark); color:#fff;"><span class="hex">#569D80</span><span class="name">dark</span></div>
    <div class="sw" style="background:var(--color-de-york-darker); color:#fff;"><span class="hex">#2B4E40</span><span class="name">darker</span></div>
    <div class="sw" style="background:var(--color-de-york-darkest); color:#fff;"><span class="hex">#203B30</span><span class="name">darkest</span></div>
  </div>
</body>
</html>
