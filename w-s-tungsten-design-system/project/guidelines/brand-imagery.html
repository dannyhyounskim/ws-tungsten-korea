<!-- @dsCard group="Brand" viewport="700x220" name="Imagery — tungsten ore" subtitle="Cool metallic silver/blue with warm ore-gold flecks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-white); font-family: var(--font-body); }
  .wrap { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; max-width: 660px; }
  .hero { height: 180px; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .notes { display: flex; flex-direction: column; justify-content: center; }
  .notes h5 { font-family: var(--font-heading); font-weight: 500; font-size: 19px; color: var(--color-neutral-darkest); margin-bottom: 8px; }
  .notes p { font-size: 12.5px; color: var(--color-neutral-dark); line-height: 1.45; }
  .chips { display: flex; gap: 6px; margin-top: 12px; }
  .chips span { width: 26px; height: 26px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero"><img src="../assets/images/home-hero-header-section.png" alt="Tungsten ore"></div>
    <div class="notes">
      <h5>Raw material, up close</h5>
      <p>Macro shots of crystalline tungsten ore — silvery, faceted, with warm gold mineralization. Cool tones, deep shadows, shallow depth of field.</p>
      <div class="chips">
        <span style="background:#9fb0bb;"></span>
        <span style="background:#3f5763;"></span>
        <span style="background:#1a2730;"></span>
        <span style="background:var(--color-web-orange);"></span>
      </div>
    </div>
  </div>
</body>
</html>
